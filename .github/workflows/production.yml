name: Production Build & Submit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Tests & Typecheck
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit --project tsconfig.json

      - run: npm test

  version:
    name: Auto Version Bump
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # La versión ya viene subida en el PR (npm run bump): `main` está protegido
      # y el bot no puede commitear en él. Aquí solo se lee y se etiqueta.
      - name: Read version
        id: bump
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Tag version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} ya existe"
            exit 0
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  build-ios:
    name: Build & Submit iOS
    runs-on: ubuntu-latest
    needs: version
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install eas-cli
        run: npm install -g eas-cli

      - run: npm ci

      - name: Build and submit iOS
        run: eas build --profile production --platform ios --non-interactive --auto-submit

  build-android:
    name: Build & Submit Android
    runs-on: ubuntu-latest
    needs: version
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install eas-cli
        run: npm install -g eas-cli

      - run: npm ci

      - name: Build and submit Android (Production track)
        run: eas build --profile production --platform android --non-interactive --auto-submit
