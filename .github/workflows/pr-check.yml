name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  version:
    name: Version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: La versión de app.json debe ser nueva
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          LAST=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "")
          echo "app.json: $VERSION · última etiqueta: $LAST"
          if [ "v$VERSION" = "$LAST" ]; then
            echo "::error::Versión sin subir. Ejecuta 'npm run bump' en develop y commitea app.json."
            exit 1
          fi

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit --project tsconfig.json

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test
