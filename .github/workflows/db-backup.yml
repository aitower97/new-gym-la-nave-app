name: Backup BD

# Backup diario de la base de datos de producción. Supabase free tier no
# incluye backups automáticos ni PITR (eso empieza en Pro), así que esto es
# la única copia que existe.
#
# El volcado incluye el esquema `auth` además de `public`: sin él, un
# restore deja las filas de `profiles` apuntando a usuarios que no existen.
#
# El fichero se cifra antes de subirse porque contiene datos personales de
# los socios (nombre, email, teléfono, fecha de nacimiento).
#
# Dos destinos (regla 3-2-1): el artifact de GitHub es la copia rápida a 90
# días, y el bucket S3 externo es la copia que sobrevive a perder la cuenta
# de GitHub. Los ficheros de Storage se copian aparte, porque pg_dump solo
# vuelca la metadata del esquema `storage`, no los objetos en sí.
#
# Procedimiento de restauración: docs/RESTORE.md

on:
  schedule:
    - cron: "0 3 * * *" # todos los días a las 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Un backup a la vez: si uno se atasca, no queremos otro encima compitiendo
# por la misma conexión del pooler.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # El pg_dump que trae ubuntu-latest es más antiguo que el Postgres de
      # Supabase, y pg_dump se niega a volcar un servidor más nuevo que él.
      - name: Instalar cliente de Postgres 17
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Volcar base de datos
        env:
          # OJO: tiene que ser la cadena del *session pooler* (puerto 5432).
          # Los runners de GitHub son solo IPv4 y la conexión directa
          # (db.<ref>.supabase.co) es IPv6. El transaction pooler (6543) no
          # sirve: pg_dump necesita sesión.
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

          pg_dump "$DB_URL" \
            --schema=public \
            --schema=auth \
            --schema=storage \
            --no-owner \
            --no-privileges \
            --exclude-table-data='auth.audit_log_entries' \
            --exclude-table-data='auth.refresh_tokens' \
            --exclude-table-data='auth.sessions' \
            --exclude-table-data='storage.migrations' \
            --exclude-table-data='public.keepalive_ping' \
            -f "backup-${STAMP}.sql"

      # Sin esto, un volcado truncado o vacío se sube igual y el fallo no se
      # descubre hasta el día que toque restaurar. pg_dump escribe el
      # marcador de cierre solo si llegó al final del volcado.
      - name: Verificar el volcado
        run: |
          set -euo pipefail
          DUMP="backup-${STAMP}.sql"

          if ! grep -q '^-- PostgreSQL database dump complete' "$DUMP"; then
            echo "::error::El volcado está truncado (falta el marcador de cierre)"
            exit 1
          fi

          for t in public.profiles public.classes public.bookings \
                   public.user_roles public.membership_plans \
                   public.user_memberships auth.users; do
            if ! grep -q "CREATE TABLE ${t} " "$DUMP"; then
              echo "::error::Falta la tabla ${t} en el volcado"
              exit 1
            fi
          done

          # Un backup sin ni un solo usuario casi seguro es un problema de
          # permisos, no un gimnasio vacío.
          if ! grep -q '^COPY auth.users ' "$DUMP"; then
            echo "::error::El volcado no trae datos de auth.users"
            exit 1
          fi

          echo "Volcado OK: $(du -h "$DUMP" | cut -f1)"

      - name: Comprimir y cifrar
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gzip -9 "backup-${STAMP}.sql"

          # --pinentry-mode loopback es obligatorio: sin él gpg 2.x ignora
          # --passphrase y busca un pinentry que en el runner no existe,
          # y aborta con "Inappropriate ioctl for device".
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --pinentry-mode loopback \
              --passphrase "$PASSPHRASE" \
              "backup-${STAMP}.sql.gz"
          rm "backup-${STAMP}.sql.gz"

      # Comprobamos que lo que subimos se puede volver a abrir. Un backup
      # cifrado con una passphrase que no es la que crees es papel mojado, y
      # esto lo detecta hoy en vez de el día del incidente.
      - name: Verificar que el cifrado se puede deshacer
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --decrypt \
              --pinentry-mode loopback \
              --passphrase "$PASSPHRASE" \
              "backup-${STAMP}.sql.gz.gpg" 2>/dev/null \
            | gzip -t
          echo "Descifrado y gzip verificados"
          ls -lh "backup-${STAMP}.sql.gz.gpg"

      - name: Copiar ficheros de Storage
        env:
          SUPABASE_URL: https://llkcidbbadjgrrquexqd.supabase.co
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          mkdir -p storage

          # Se recorren TODOS los buckets, no una lista fija: hoy son `avatars`
          # y `public_brand`, y si mañana se crea otro entra solo en el backup
          # sin que nadie tenga que acordarse de tocar este fichero.
          #
          # La lista sale de storage.objects y no de la API de listado porque
          # los objetos se guardan anidados (`<userId>/avatar-<ts>.jpg`) y
          # /object/list solo devuelve un nivel: habría que recorrer carpeta a
          # carpeta. La tabla da la ruta completa de una vez.
          psql "$DB_URL" --no-align --tuples-only --quiet \
            -c "SELECT bucket_id || '/' || name FROM storage.objects ORDER BY bucket_id, name" \
            > objetos.txt

          TOTAL=$(grep -c . objetos.txt || true)
          echo "Objetos en Storage: $TOTAL"

          while read -r RUTA; do
            [ -z "$RUTA" ] && continue
            mkdir -p "storage/$(dirname "$RUTA")"
            curl -sf "$SUPABASE_URL/storage/v1/object/${RUTA}" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -o "storage/${RUTA}"
          done < objetos.txt

          DESCARGADOS=$(find storage -type f | wc -l)
          echo "Ficheros descargados: $DESCARGADOS"
          if [ "$DESCARGADOS" -ne "$TOTAL" ]; then
            echo "::error::Se esperaban $TOTAL ficheros y se bajaron $DESCARGADOS"
            exit 1
          fi
          rm objetos.txt
          tar czf "storage-${STAMP}.tar.gz" storage
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --pinentry-mode loopback \
              --passphrase "$PASSPHRASE" \
              "storage-${STAMP}.tar.gz"
          rm -rf storage "storage-${STAMP}.tar.gz"

      - name: Subir artifact (copia rápida, 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: |
            backup-*.sql.gz.gpg
            storage-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

      # Copia externa: es la que sigue existiendo si se pierde el acceso a
      # la cuenta de GitHub o el repo se borra. Endpoint compatible con S3
      # (Cloudflare R2, Backblaze B2 o AWS S3 según el secret).
      - name: Subir copia externa a S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          # Desde la v2.23 el CLI de AWS manda cabeceras de checksum
          # (x-amz-checksum-*) por defecto, y los backends compatibles con S3
          # que no las implementan responden 400. Es el motivo habitual de que
          # la primera subida a R2 o B2 falle sin razón aparente.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          DEST="s3://${BUCKET}/la-nave/$(date -u +%Y/%m)"
          aws s3 cp "backup-${STAMP}.sql.gz.gpg"  "${DEST}/" --only-show-errors
          aws s3 cp "storage-${STAMP}.tar.gz.gpg" "${DEST}/" --only-show-errors
          aws s3 ls "${DEST}/backup-${STAMP}.sql.gz.gpg"

      # `echo ::error::` solo pinta el fallo en la pestaña de Actions. GitHub
      # manda email al autor del último commit cuando falla un workflow
      # programado, pero ese email se pierde entre el ruido: esto avisa donde
      # se lee de verdad.
      - name: Avisar si ha fallado
        if: failure()
        env:
          WEBHOOK: ${{ secrets.BACKUP_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::error::El backup diario de la BD ha fallado"
          if [ -n "${WEBHOOK:-}" ]; then
            curl -sf -X POST "$WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"El backup diario de La Nave ha fallado: ${RUN_URL}\"}" \
              || echo "::warning::No se pudo enviar el aviso al webhook"
          else
            echo "::warning::BACKUP_ALERT_WEBHOOK no configurado; sin aviso externo"
          fi
